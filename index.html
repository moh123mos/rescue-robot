<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>إنقاذ الروبوت من الحفرة</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🤖%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;900&family=Lalezar&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script type="importmap">
  { "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }
  </script>
</head>
<body>
  <div id="app">
    <div id="stageHost"></div>

    <!-- hud-dom: عناصر واجهة بإحداثيات اللوحة (1254×1254) تتحرك مع الكاميرا -->
    <div id="hud" aria-label="لوحة اللعب"></div>

    <canvas id="dice3d" aria-hidden="true"></canvas>
    <div id="fxLayer"></div>
    <div id="toastLayer" aria-live="polite"></div>

    <!-- أزرار ثابتة -->
    <div id="corner">
      <button id="btnMusic" class="round-btn" title="الموسيقى" aria-label="الموسيقى">🎵</button>
      <button id="btnSound" class="round-btn" title="كتم / تشغيل الصوت" aria-label="كتم / تشغيل الصوت">🔊</button>
      <button id="btnGear" class="round-btn" title="لوحة المعلّم" aria-label="لوحة المعلّم">⚙</button>
    </div>
    <div id="skipHint" class="hidden">اضغط للتخطي ⏩</div>
    <div id="rollHint" class="hidden"></div>

    <div id="modalRoot"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/pixi.js@8.6.6/dist/pixi.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/MotionPathPlugin.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

  <script src="data/tiles.js"></script>
  <script src="data/cards.js"></script>
  <script src="data/characters.js"></script>
  <script src="js/logic.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/characters.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/view.js"></script>
  <script type="module" src="js/dice3d.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
